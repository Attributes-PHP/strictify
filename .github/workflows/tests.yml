name: Tests

on:
  # push on any branch (incl. PR branches), so feature branches get CI
  # even where pull_request events are not delivered
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: pcov

    - name: Install PHP dependencies
      run: composer update --prefer-stable --no-interaction --no-progress --ansi

    - name: Run test suite
      run: composer run-script test
